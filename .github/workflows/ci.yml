name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-app

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e test
        run: ./mvnw -B verify

  docker:
    #serve a indicare che il job docker parta solo quando il job qui definito sia stato eseguito e verde
    needs: build-test
    #indica che questo job non deve girare sulle pull_request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker image
        run: |
          BRANCH_TAG=$(echo "$GITHUB_REF_NAME" | tr '/' '-' )
          docker build -f Dockerfile_v2 -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$BRACH_TAG" .
      - name: Scan Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}:${{ github.sha }}
          #blocca tutto se si riscontrano errori critici e risolvibili
          only-severities: critical
          only-fixed: true
          exit-code: true
      #se tutto va bene vado a pushare sulla repo
      - name: Push su Docker hub
        run: docker push --all-tags "$IMAGE"

